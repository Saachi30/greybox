# GREYBOX Nmap Configuration
# Default settings for nmap scans

# Timing template (0=paranoid, 5=insane)
timing=3

# Max retries for port scanning
max-retries=3

# Host timeout (ms)
host-timeout=900000

# Script timeout (s)
script-timeout=600

# Max parallelism
max-parallelism=50

# Min rate (packets/sec)
min-rate=100

# DNS resolution
dns-servers=8.8.8.8,1.1.1.1

# NSE script arguments
script-args=unsafe=1,vulns.showall=1

# Output directory
datadir=/root/workdir/scans
