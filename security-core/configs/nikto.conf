# GREYBOX Nikto Configuration
# Web server vulnerability scanner settings

# Tuning options (comma-separated)
# 0: File Upload
# 1: Interesting File
# 2: Misconfiguration/Default File
# 3: Information Disclosure
# 4: Injection (XSS/Script/HTML)
# 5: Remote File Retrieval - Inside Web Root
# 6: Denial of Service
# 7: Remote File Retrieval - Server Wide
# 8: Command Execution / Remote Shell
# 9: SQL Injection
# a: Authentication Bypass
# b: Software Identification
# c: Remote Source Inclusion
TUNING=4,6,8,9,a,b,c

# Timeout in seconds
TIMEOUT=10

# Max scan time
MAXTIME=30m

# User agent
USERAGENT=Mozilla/5.0 (compatible; GREYBOX-Scanner/1.0)

# Follow redirects
FOLLOWREDIRECTS=yes

# SSL (1=on, 0=off)
SSL=1

# Plugins to use
PLUGINS=all

# Output format (csv, html, txt, xml)
FORMAT=xml

# Verbose output
VERBOSE=yes
